<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Gaussian Splat Labs</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2/build/playcanvas.mjs"
    }
  }
  </script>
</head>
<body>
  <splat-scene id="app" catalog="./catalog.json"></splat-scene>

  <script type="module">
    import './components/splat-scene.js';
    import './components/hamburger-menu.js';
    import { BlindCane } from './experiments/blind-cane.js';
    import { WubWub } from './experiments/wubwub.js';

    const app = document.querySelector('splat-scene');
    app.addEventListener('ready', () => {
      app.registerExperiment('blind-cane', new BlindCane(app));
      app.registerExperiment('wubwub', new WubWub(app));
    }, { once: true });

    // Service worker: offline-capable app shell + cross-origin model
    // weight caching (so a downloaded model survives flaky / no
    // network — Underground-train safe).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js')
          .then(reg => console.log('[sw] registered, scope', reg.scope))
          .catch(err => console.warn('[sw] register failed', err));
      });
    }

    // Defensive: surface any uncaught error or unhandled promise
    // rejection in the AI banner so the user knows *what* failed when
    // something blows up mid-inference. Doesn't prevent tab kills (the
    // browser does those at native level before JS gets a turn) but
    // catches everything within reach. Failures stay visible after
    // model errors so the user knows to switch model or safe-mode.
    function reportFailure(label, err) {
      const msg = (err && (err.message || err.toString())) || String(err);
      console.error('[' + label + ']', err);
      try {
        const s = document.querySelector('splat-scene');
        s?.showResponse?.(`${label}: ${msg}`, { badge: 'Error', ttlMs: 12000 });
      } catch {}
    }
    window.addEventListener('error', (e) => reportFailure('Uncaught error', e.error || e.message));
    window.addEventListener('unhandledrejection', (e) => reportFailure('Promise', e.reason));
  </script>
</body>
</html>
